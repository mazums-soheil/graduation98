<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050708">
<title>MAZUMS</title>
<style>html,body{margin:0;width:100%;height:100%;background:#050708}body{visibility:hidden}</style>
<script>
(() => {
  const parts = location.pathname.split('/').filter(Boolean);
  const root = location.origin + (parts.length ? '/' + parts[0] + '/' : '/');
  location.replace(root + location.search + location.hash);
})();
</script>
</head><body></body></html>
